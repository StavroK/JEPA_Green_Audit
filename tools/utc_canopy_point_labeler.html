<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UTC Canopy Point Labeler</title>
<style>
body{font-family:system-ui,sans-serif;margin:18px;background:#f5f5f5;color:#222}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
button,input{font:inherit}
button.active{outline:3px solid #333}
canvas{border:1px solid #555;background:#111;max-width:100%;height:auto;cursor:crosshair}
.note{max-width:1100px;line-height:1.4}
.counts{font-weight:600}
</style>
</head>
<body>
<h1>UTC canopy point labeler</h1>
<p class="note">
Load the high-resolution RGB preview. Click representative pixels/locations as
<strong>Tree canopy</strong>, <strong>Non-tree</strong>, or <strong>Uncertain</strong>.
Spread labels across the whole image: park interior, roads, parking, buildings,
grass, shadows, dense crowns, isolated crowns, and mixed edges.
</p>
<div class="toolbar">
<input id="file" type="file" accept="image/png,image/jpeg">
<button id="tree" class="active">Tree canopy</button>
<button id="non">Non-tree</button>
<button id="uncertain">Uncertain</button>
<button id="undo">Undo last</button>
<button id="clear">Clear all</button>
<button id="export">Export labels JSON</button>
<span class="counts" id="counts"></span>
</div>
<canvas id="canvas"></canvas>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let img=new Image(), labels=[], mode='tree', imageName='';
const colors={tree:'#00ff55',non:'#ff3b30',uncertain:'#ffd60a'};
function setMode(m){
 mode=m;
 for(const id of ['tree','non','uncertain']) document.getElementById(id).classList.toggle('active',id===m);
}
document.getElementById('tree').onclick=()=>setMode('tree');
document.getElementById('non').onclick=()=>setMode('non');
document.getElementById('uncertain').onclick=()=>setMode('uncertain');
function counts(){
 const c={tree:0,non:0,uncertain:0};
 labels.forEach(x=>c[x.label]++);
 document.getElementById('counts').textContent=`Tree ${c.tree} · Non-tree ${c.non} · Uncertain ${c.uncertain}`;
}
function redraw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(img.complete&&img.width)ctx.drawImage(img,0,0);
 for(const l of labels){
   ctx.beginPath();ctx.arc(l.x,l.y,4,0,Math.PI*2);
   ctx.fillStyle=colors[l.label];ctx.fill();
   ctx.lineWidth=1.5;ctx.strokeStyle='#000';ctx.stroke();
 }
 counts();
}
document.getElementById('file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;imageName=f.name;
 img.onload=()=>{canvas.width=img.width;canvas.height=img.height;redraw()};
 img.src=URL.createObjectURL(f);
};
canvas.onclick=e=>{
 if(!img.width)return;
 const r=canvas.getBoundingClientRect();
 const x=Math.round((e.clientX-r.left)*canvas.width/r.width);
 const y=Math.round((e.clientY-r.top)*canvas.height/r.height);
 labels.push({x,y,label:mode});redraw();
};
document.getElementById('undo').onclick=()=>{labels.pop();redraw()};
document.getElementById('clear').onclick=()=>{if(confirm('Clear all labels?')){labels=[];redraw()}};
document.getElementById('export').onclick=()=>{
 const payload={schema_version:1,task:'utc_canopy_point_labels',image:imageName,width_px:canvas.width,height_px:canvas.height,labels};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='utc_canopy_point_labels.json';a.click();
};
counts();
</script>
</body>
</html>
