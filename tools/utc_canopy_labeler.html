<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UTC Canopy Polygon Labeler</title>
<style>
body{font-family:system-ui,sans-serif;margin:20px;background:#f5f5f5;color:#222}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button,input{font:inherit}
canvas{border:1px solid #555;background:#111;max-width:100%;height:auto;cursor:crosshair}
.note{max-width:1000px;line-height:1.4}
</style>
</head>
<body>
<h1>Urban Tree Canopy polygon labeler</h1>
<p class="note">Load the RGB preview, click around visible tree-crown canopy, then close the polygon. Draw canopy only; exclude grass, buildings, roads, bare soil, and unsupported shadow. Export the JSON when finished.</p>
<div class="toolbar">
<input id="file" type="file" accept="image/*">
<button id="close">Close polygon</button>
<button id="undo">Undo point</button>
<button id="delete">Delete last polygon</button>
<button id="export">Export annotations JSON</button>
</div>
<canvas id="canvas"></canvas>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let img=new Image(),points=[],polygons=[],imageName='';
function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(img.complete&&img.width) ctx.drawImage(img,0,0);
  ctx.lineWidth=2;
  ctx.strokeStyle='#00ff55';ctx.fillStyle='rgba(0,255,85,.18)';
  for(const poly of polygons){ctx.beginPath();poly.points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();ctx.stroke();}
  ctx.strokeStyle='#ffff00';ctx.fillStyle='#ffff00';ctx.beginPath();
  points.forEach((p,i)=>{if(i)ctx.lineTo(...p);else ctx.moveTo(...p);ctx.fillRect(p[0]-2,p[1]-2,4,4)});ctx.stroke();
}
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0]; if(!f)return; imageName=f.name;
  img.onload=()=>{canvas.width=img.width;canvas.height=img.height;redraw()};
  img.src=URL.createObjectURL(f);
};
canvas.onclick=e=>{
  if(!img.width)return;
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)*canvas.width/r.width;
  const y=(e.clientY-r.top)*canvas.height/r.height;
  points.push([Math.round(x),Math.round(y)]);redraw();
};
document.getElementById('close').onclick=()=>{if(points.length>=3){polygons.push({points:[...points]});points=[];redraw()}};
document.getElementById('undo').onclick=()=>{points.pop();redraw()};
document.getElementById('delete').onclick=()=>{polygons.pop();redraw()};
document.getElementById('export').onclick=()=>{
 const payload={schema_version:1,task:'urban_tree_canopy_polygon_annotation',image:imageName,width_px:canvas.width,height_px:canvas.height,polygons};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='utc_canopy_annotations.json';a.click();
};
</script>
</body>
</html>
