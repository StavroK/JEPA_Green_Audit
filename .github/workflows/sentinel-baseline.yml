name: Sentinel-2 Baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "jepa_green_audit/sentinel2.py"
      - "scripts/fetch_sentinel2.py"
      - "config/aoi_fundidora.geojson"
      - "requirements.txt"
      - ".github/workflows/sentinel-baseline.yml"

permissions:
  contents: read

jobs:
  fundidora-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Query and analyze Sentinel-2
        run: python scripts/fetch_sentinel2.py
      - name: Show provenance summary
        run: cat outputs/fundidora_sentinel2_baseline.json
      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: fundidora-sentinel2-baseline
          path: outputs/fundidora_sentinel2_baseline.json
          retention-days: 30
