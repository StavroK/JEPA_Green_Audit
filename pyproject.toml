[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-green-audit"
version = "0.1.0"
description = "AI4GOOD urban vegetation monitoring research prototype"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["jepa_green_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
